server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In the docker-compose stack, the "backend" service name resolves via
    # Docker's internal DNS - this lets the frontend call same-origin
    # "/api/..." in production too, exactly like the Vite dev proxy does,
    # so no CORS configuration is needed when running via docker-compose.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 30M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
